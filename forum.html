<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="images/jpeg" href="images/R.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <form action="neta.py" method="post" enctype="multipart/form-data">
        <label for="username">Username</label>
        <input type="text" placeholder="Spongebob" id="username"required minlength="6" maxlength="12">
        <br>
        <label for="password">password:</label>    
        <input type="password" id="password" required minlength="8" maxlength="16">
        <br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" required minlength="8" maxlength="16">
        <br>
        <label for="email">Email:</label>
        <input type="email" style="background-color: #f0f0f0;"  id="email" placeholder="spongebob@example.com" required>
        <br>
        <label for="tel">Phone:</label>
        <input type="tel" id="tel" required minlength="11" placeholder="0813-935-4163" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}">
        <br>
        <label for="birth">Birthdate:</label>
        <input style="background-color: aquamarine;"  type="date" id="birth" placeholder="22/11/2009" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
        <br>
        <label for="quan">quantity:</label>
        <input type="number" id="quan" min="-22" max="99" value="1">
        <br>
        <label for="mr">Mr</label>
        <input type="radio" name="t" id="mr" value="Mr">
        
        <label for="mrs">Mrs</label>
        <input type="radio" name="t" id="mrs" value="Mrs">
        <br> 
        <label for="payment">PAYMENT</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select>
        <br>
        <label for="sub">Susbcribe</label>
        <input type="checkbox" id="sub"><br>
         <label for="com">Comment</label>
         <textarea id="com" rows="3" cols="25"></textarea><br>
         <label for="file">File</label>
         <input type="file" id="file" accept="image/png,  image/jpeg,image/webp"><br>
        <br>

        <input type="submit">
        <br>
        <input type="reset">       
    </form>
</body>
</html>
